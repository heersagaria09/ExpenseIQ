<!DOCTYPE html>
<html lang="en">
<head>
  <script>
    /* CRITICAL: Set theme INSTANTLY before ANY rendering */
    (function() {
      try {
        var theme = localStorage.getItem('expenseiq_theme') || 'dark';
        document.documentElement.setAttribute('data-theme', theme);
      } catch(e) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();
  </script>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login — ExpenseIQ</title>
  <style>
    /* CRITICAL: Pure CSS solution - no flash ever */
    html, body, .auth-body {
      background-color: #020817 !important;
      margin: 0;
      padding: 0;
    }
    html[data-theme="light"], 
    html[data-theme="light"] body,
    html[data-theme="light"] .auth-body {
      background-color: #f8fafc !important;
    }
  </style>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="/static/css/main.css" rel="stylesheet"/>
  <link href="/static/css/auth.css" rel="stylesheet"/>
</head>
<body class="auth-body">
<div class="auth-page">
  <div class="auth-container">
    <div class="auth-card login-card">
      <div class="auth-header">
        <a href="/" class="auth-logo">
          <svg width="36" height="36" viewBox="0 0 32 32" fill="none"><rect width="32" height="32" rx="8" fill="var(--accent)"/><rect x="6" y="18" width="4" height="8" rx="1" fill="white"/><rect x="14" y="12" width="4" height="14" rx="1" fill="white"/><rect x="22" y="6" width="4" height="20" rx="1" fill="white"/></svg>
          <span>Expense<span class="text-green">IQ</span></span>
        </a>
        <h2 class="auth-title">Welcome Back</h2>
        <p class="auth-subtitle">Continue managing your finances</p>
      </div>

      <!-- Social Login -->
      <div class="social-login">
        <button id="googleLoginBtn" class="social-btn-lg" onclick="googleLogin()" aria-label="Sign in with Google">
          <svg width="18" height="18" viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.60 3.30-4.53 6.16-4.53z" fill="#EA4335"/></svg>
          Google
        </button>
        <button class="social-btn-lg" aria-label="Sign in with Apple">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12.152 6.896c-.948 0-2.415-1.078-3.96-1.04-2.04.027-3.91 1.183-4.961 3.014-2.117 3.675-.54 9.103 1.519 12.09 1.013 1.454 2.208 3.09 3.792 3.039 1.52-.065 2.09-.987 3.935-.987 1.831 0 2.35.987 3.96.948 1.637-.026 2.676-1.48 3.676-2.948 1.156-1.688 1.636-3.325 1.662-3.415-.039-.013-3.182-1.221-3.22-4.857-.026-3.04 2.48-4.494 2.597-4.559-1.429-2.09-3.623-2.324-4.39-2.376-2-.156-3.675 1.09-4.61 1.09z"/></svg>
          Apple
        </button>
        <button class="social-btn-lg" onclick="switchTab('otp', document.querySelectorAll('.auth-tab')[1])" aria-label="Continue with mobile number">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 12 19.79 19.79 0 0 1 1.61 3.38 2 2 0 0 1 3.6 1.18h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L7.91 8.27a16 16 0 0 0 5.54 5.54l.62-.87a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7a2 2 0 0 1 1.72 2.03z"/></svg>
          Mobile
        </button>
      </div>

      <div class="auth-divider"><span>Or continue with email</span></div>

      <!-- Tab Switcher -->
      <div class="auth-tabs">
        <button class="auth-tab active" onclick="switchTab('email', this)">Email</button>
        <button class="auth-tab" onclick="switchTab('otp', this)">Mobile OTP</button>
      </div>

      <!-- Email Login -->
      <form id="emailTab" class="auth-form auth-form-horizontal" onsubmit="loginEmail(event)">
        <div class="auth-field">
          <div class="field-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
          </div>
          <div class="field-body">
            <label for="loginIdentifier">Email or Mobile</label>
            <input name="identifier" autocomplete="username" aria-label="Email address or mobile number" type="text" id="loginIdentifier" placeholder="Enter email, username, or mobile" required/>
          </div>
        </div>
        <div class="auth-field">
          <div class="field-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          </div>
          <div class="field-body">
            <label for="loginPassword">Password</label>
            <input name="password" autocomplete="current-password" aria-label="Password" type="password" id="loginPassword" placeholder="Enter your password" required/>
          </div>
          <button type="button" class="toggle-pw" onclick="togglePw('loginPassword', this)">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
        <div class="auth-options auth-field-full">
          <label class="check-label"><input type="checkbox" id="rememberMe" aria-label="Remember me"/> Remember me</label>
          <a href="#" onclick="showForgotPassword()">Forgot Password?</a>
        </div>
        <button type="submit" class="btn-auth auth-field-full" id="loginBtn">Log In</button>
      </form>

      <!-- OTP Login -->
      <form id="otpTab" class="auth-form" style="display:none;">
        <div id="otpStep1">
          <div class="auth-field">
            <div class="field-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 12 19.79 19.79 0 0 1 1.61 3.38 2 2 0 0 1 3.6 1.18h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L7.91 8.27a16 16 0 0 0 5.54 5.54l.62-.87a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7a2 2 0 0 1 1.72 2.03z"/></svg>
            </div>
            <div class="field-body">
              <label>Mobile Number</label>
              <input name="mobile" autocomplete="tel" type="tel" id="loginMobile" inputmode="numeric" placeholder="+91 Enter your mobile number" maxlength="10"/>
            </div>
          </div>
          <button type="button" class="btn-auth" onclick="sendOTP('login')">Send OTP</button>
        </div>
        <div id="otpStep2" style="display:none;">
          <p class="otp-sent-msg">OTP sent to <strong id="otpMobileDisplay"></strong></p>
          <div class="otp-inputs">
            <input type="text" maxlength="1" class="otp-box" oninput="otpNext(this, 0)"/>
            <input type="text" maxlength="1" class="otp-box" oninput="otpNext(this, 1)"/>
            <input type="text" maxlength="1" class="otp-box" oninput="otpNext(this, 2)"/>
            <input type="text" maxlength="1" class="otp-box" oninput="otpNext(this, 3)"/>
            <input type="text" maxlength="1" class="otp-box" oninput="otpNext(this, 4)"/>
            <input type="text" maxlength="1" class="otp-box" oninput="otpNext(this, 5)"/>
          </div>
          <div class="otp-actions">
            <button type="button" class="btn-auth" onclick="verifyOTP('login')">Verify OTP</button>
            <button type="button" class="btn-resend" id="resendBtn" onclick="resendOTP('login')">Resend OTP</button>
          </div>
        </div>
      </form>

      <p class="auth-switch">Don't have an account? <a href="/signup">Sign Up</a>
    </div>
  </div>
</div>

<!-- Forgot Password Modal -->
<div class="modal fade" id="forgotModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Reset Password</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div id="forgotStep1">
          <p style="color:var(--text-secondary);margin-bottom:16px;">Enter your email to receive reset instructions.</p>
          <input type="email" id="forgotEmail" name="email" autocomplete="email" class="form-control" placeholder="Your email address"/>
          <button class="btn-auth mt-3 w-100" onclick="submitForgotPassword()">Send Reset Instructions</button>
        </div>
        <div id="forgotStep2" style="display:none;">
          <p style="color:var(--text-secondary);margin-bottom:16px;">Enter the reset token sent to your email.</p>
          <input type="text" id="resetToken" class="form-control mb-2" placeholder="Reset token"/>
          <input type="password" id="newPassword" class="form-control mb-2" placeholder="New password"/>
          <input type="password" id="confirmNewPassword" class="form-control" placeholder="Confirm new password"/>
          <button class="btn-auth mt-3 w-100" onclick="submitResetPassword()">Reset Password</button>
        </div>
      </div>
    </div>
  </div>
</div>

<div id="toastContainer" class="toast-container position-fixed bottom-0 end-0 p-3"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/static/js/theme.js"></script>
<script src="/static/js/main.js"></script>
<script src="/static/js/auth.js"></script>
<!-- Server-side flash messages -> display as toasts -->
<script>
  (function(){
    try {
      const flashes = {{ get_flashed_messages(with_categories=True) | tojson }} || [];
      if (flashes && flashes.length) {
        flashes.forEach(function(item){
          try {
            const cat = item[0] || 'info';
            const msg = item[1] || item[0] || '';
            if (typeof showToast === 'function') showToast(msg, cat, 5000);
          } catch(e){}
        });
      }
    } catch(e){}
  })();
</script>
</body>
</html>
