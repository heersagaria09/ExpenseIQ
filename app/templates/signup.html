<!DOCTYPE html>
<html lang="en">
<head>
  <script>
    /* CRITICAL: Set theme INSTANTLY before ANY rendering */
    (function() {
      try {
        var theme = localStorage.getItem('expenseiq_theme') || 'dark';
        document.documentElement.setAttribute('data-theme', theme);
      } catch(e) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();
  </script>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sign Up — ExpenseIQ</title>
  <style>
    /* CRITICAL: Pure CSS solution - no flash ever */
    html, body, .auth-body {
      background-color: #020817 !important;
      margin: 0;
      padding: 0;
    }
    html[data-theme="light"], 
    html[data-theme="light"] body,
    html[data-theme="light"] .auth-body {
      background-color: #f8fafc !important;
    }
  </style>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="/static/css/main.css" rel="stylesheet"/>
  <link href="/static/css/auth.css" rel="stylesheet"/>
</head>
<body class="auth-body">
<div class="auth-page">
  <div class="auth-container">
    <div class="auth-card signup-card">
      <div class="auth-header">
        <a href="/" class="auth-logo">
          <svg width="36" height="36" viewBox="0 0 32 32" fill="none"><rect width="32" height="32" rx="8" fill="var(--accent)"/><rect x="6" y="18" width="4" height="8" rx="1" fill="white"/><rect x="14" y="12" width="4" height="14" rx="1" fill="white"/><rect x="22" y="6" width="4" height="20" rx="1" fill="white"/></svg>
          <span>Expense<span class="text-green">IQ</span></span>
        </a>
        <h2 class="auth-title">Create Your Account</h2>
        <p class="auth-subtitle">Start managing your finances smarter with AI</p>
      </div>

      <!-- Social Login -->
      <div class="social-login">
        <button class="social-btn-lg" onclick="googleLogin()" aria-label="Sign up with Google">
          <svg width="18" height="18" viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.60 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
          Google
        </button>
        <button class="social-btn-lg" aria-label="Sign up with Apple">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12.152 6.896c-.948 0-2.415-1.078-3.96-1.04-2.04.027-3.91 1.183-4.961 3.014-2.117 3.675-.54 9.103 1.519 12.09 1.013 1.454 2.208 3.09 3.792 3.039 1.52-.065 2.09-.987 3.935-.987 1.831 0 2.35.987 3.96.948 1.637-.026 2.676-1.48 3.676-2.948 1.156-1.688 1.636-3.325 1.662-3.415-.039-.013-3.182-1.221-3.22-4.857-.026-3.04 2.48-4.494 2.597-4.559-1.429-2.09-3.623-2.324-4.39-2.376-2-.156-3.675 1.09-4.61 1.09z"/></svg>
          Apple
        </button>
        <button class="social-btn-lg" onclick="switchToMobileSignup()" aria-label="Sign up with mobile number">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 12 19.79 19.79 0 0 1 1.61 3.38 2 2 0 0 1 3.6 1.18h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L7.91 8.27a16 16 0 0 0 5.54 5.54l.62-.87a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7a2 2 0 0 1 1.72 2.03z"/></svg>
          Mobile Number
        </button>
      </div>

      <div class="auth-divider"><span>Or continue with email</span></div>

      <!-- Email Signup Form -->
      <form id="signupForm" class="auth-form auth-form-horizontal" onsubmit="registerUser(event)">
        <div class="auth-field">
          <div class="field-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          </div>
          <div class="field-body">
            <label for="signupName">Full Name</label>
            <input name="full_name" autocomplete="name" aria-label="Full name" type="text" id="signupName" placeholder="Enter your full name" required/>
          </div>
        </div>
        <div class="auth-field">
          <div class="field-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
          </div>
          <div class="field-body">
            <label for="signupUsername">Username</label>
            <input name="username" autocomplete="username" aria-label="Username" type="text" id="signupUsername" placeholder="Choose a username" required/>
          </div>
        </div>
        <div class="auth-field">
          <div class="field-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
          </div>
          <div class="field-body">
            <label for="signupEmail">Email</label>
            <input name="email" autocomplete="email" aria-label="Email address" type="email" id="signupEmail" placeholder="you@example.com" required/>
          </div>
        </div>
        <div class="auth-field">
          <div class="field-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 12 19.79 19.79 0 0 1 1.61 3.38 2 2 0 0 1 3.6 1.18h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L7.91 8.27a16 16 0 0 0 5.54 5.54l.62-.87a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7a2 2 0 0 1 1.72 2.03z"/></svg>
          </div>
          <div class="field-body">
            <label for="signupMobile">Mobile Number</label>
            <input name="mobile" autocomplete="tel" aria-label="Mobile number" type="tel" id="signupMobile" inputmode="numeric" maxlength="10" placeholder="+91 9876543210" required/>
          </div>
        </div>
        <div class="auth-field">
          <div class="field-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          </div>
          <div class="field-body">
            <label for="signupPassword">Password</label>
            <input name="password" autocomplete="new-password" aria-label="Create password" type="password" id="signupPassword" placeholder="Create a strong password" required/>
          </div>
          <button type="button" class="toggle-pw" onclick="togglePw('signupPassword', this)">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
        <div class="auth-field">
          <div class="field-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          </div>
          <div class="field-body">
            <label for="signupConfirmPassword">Confirm Password</label>
            <input name="confirm_password" autocomplete="new-password" aria-label="Confirm password" type="password" id="signupConfirmPassword" placeholder="Confirm your password" required/>
          </div>
          <button type="button" class="toggle-pw" onclick="togglePw('signupConfirmPassword', this)">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
        <label class="check-label auth-field-full">
          <input type="checkbox" id="agreeTerms" required aria-label="Agree to terms"/>
          I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>
        </label>
        <div class="password-strength auth-field-full">
          <div class="password-strength-bar">
            <div class="password-strength-fill" id="strengthFill"></div>
          </div>
          <span class="password-strength-text" id="strengthText">Weak</span>
        </div>
        <button type="submit" class="btn-auth auth-field-full">Create Account</button>
      </form>

      <!-- Mobile OTP Signup (hidden by default) -->
      <div id="mobileSignupForm" style="display:none;">
        <div class="auth-field" id="mobileFieldSU">
          <div class="field-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 12 19.79 19.79 0 0 1 1.61 3.38 2 2 0 0 1 3.6 1.18h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L7.91 8.27a16 16 0 0 0 5.54 5.54l.62-.87a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7a2 2 0 0 1 1.72 2.03z"/></svg>
          </div>
          <div class="field-body">
            <label>Mobile Number</label>
            <input name="mobile" autocomplete="tel" type="tel" id="signupMobile" inputmode="numeric" maxlength="10" placeholder="10-digit mobile number"/>
          </div>
        </div>
        <button type="button" class="btn-auth" onclick="sendOTP('signup')">Send OTP</button>
        <button type="button" class="btn-auth-outline" onclick="switchToEmailSignup()">Use Email Instead</button>
        <div id="signupOTPStep" style="display:none;">
          <input type="text" id="signupFullName" class="form-control mb-2" placeholder="Your full name"/>
          <p class="otp-sent-msg mt-2">OTP sent to <strong id="signupMobileDisplay"></strong></p>
          <div class="otp-inputs">
            <input type="text" maxlength="1" class="otp-box" oninput="otpNext(this, 0)"/>
            <input type="text" maxlength="1" class="otp-box" oninput="otpNext(this, 1)"/>
            <input type="text" maxlength="1" class="otp-box" oninput="otpNext(this, 2)"/>
            <input type="text" maxlength="1" class="otp-box" oninput="otpNext(this, 3)"/>
            <input type="text" maxlength="1" class="otp-box" oninput="otpNext(this, 4)"/>
            <input type="text" maxlength="1" class="otp-box" oninput="otpNext(this, 5)"/>
          </div>
          <button type="button" class="btn-auth mt-2" onclick="verifyOTP('signup')">Verify & Create Account</button>
        </div>
      </div>

      <p class="auth-switch">Already have an account? <a href="/login">Log In</a>
    </div>
  </div>
</div>

<div id="toastContainer" class="toast-container position-fixed bottom-0 end-0 p-3"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/static/js/theme.js"></script>
<script src="/static/js/main.js"></script>
<script src="/static/js/auth.js"></script>
<script>
function switchToMobileSignup() {
  document.getElementById('signupForm').style.display = 'none';
  document.getElementById('mobileSignupForm').style.display = 'block';
}
function switchToEmailSignup() {
  document.getElementById('mobileSignupForm').style.display = 'none';
  document.getElementById('signupForm').style.display = 'block';
}

// Password strength indicator
document.addEventListener('DOMContentLoaded', function() {
  const passwordInput = document.getElementById('signupPassword');
  const strengthFill = document.getElementById('strengthFill');
  const strengthText = document.getElementById('strengthText');
  
  if (passwordInput && strengthFill && strengthText) {
    passwordInput.addEventListener('input', function() {
      const password = this.value;
      let strength = 0;
      
      if (password.length >= 8) strength++;
      if (password.match(/[a-z]/) && password.match(/[A-Z]/)) strength++;
      if (password.match(/\d/)) strength++;
      if (password.match(/[^a-zA-Z\d]/)) strength++;
      
      strengthFill.className = 'password-strength-fill';
      
      if (strength <= 1) {
        strengthFill.classList.add('weak');
        strengthText.textContent = 'Weak';
      } else if (strength <= 3) {
        strengthFill.classList.add('medium');
        strengthText.textContent = 'Medium';
      } else {
        strengthFill.classList.add('strong');
        strengthText.textContent = 'Strong';
      }
    });
  }
});
</script>
<!-- Server-side flash messages -> display as toasts -->
<script>
  (function(){
    try {
      const flashes = {{ get_flashed_messages(with_categories=True) | tojson }} || [];
      if (flashes && flashes.length) {
        flashes.forEach(function(item){
          try {
            const cat = item[0] || 'info';
            const msg = item[1] || item[0] || '';
            if (typeof showToast === 'function') showToast(msg, cat, 5000);
          } catch(e){}
        });
      }
    } catch(e){}
  })();
</script>
</body>
</html>
