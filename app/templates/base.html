<!DOCTYPE html>
<html lang="en">
<head>
  <script>
    /* CRITICAL: Set theme INSTANTLY before ANY rendering */
    (function() {
      try {
        var theme = localStorage.getItem('expenseiq_theme') || 'dark';
        document.documentElement.setAttribute('data-theme', theme);
      } catch(e) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();
  </script>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <style>
    /* CRITICAL: Pure CSS solution - no flash ever */
    html, body {
      background-color: #090d18 !important;
      margin: 0;
      padding: 0;
    }
    html[data-theme="light"], html[data-theme="light"] body {
      background-color: #f0f4f8 !important;
    }
  </style>
  <title>{% block title %}ExpenseIQ{% endblock %} — AI-Powered Finance</title>
  <link rel="icon" type="image/svg+xml" href="/static/images/favicon.svg"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://unpkg.com/lucide@latest/dist/umd/lucide.min.css" rel="stylesheet"/>
  <link href="https://unpkg.com/aos@2.3.4/dist/aos.css" rel="stylesheet"/>
  <link href="/static/css/main.css" rel="stylesheet"/>
  {% block extra_css %}{% endblock %}
</head>
<body>
  {% block body %}{% endblock %}

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <script src="/static/js/theme.js"></script>
  <script src="/static/js/main.js"></script>
  {% block extra_js %}{% endblock %}
  <script>
    if (typeof lucide !== 'undefined') lucide.createIcons();
    if (typeof AOS !== 'undefined') AOS.init({ duration: 600, once: true });
  </script>
</body>
</html>
